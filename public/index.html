<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__title">
        <span class="app-header__dot"></span>
        Gemini Chatbot
      </div>
      <span class="app-header__model">gemini-3.5-flash</span>
    </header>

    <main id="chat-window" class="chat-window">
      <div class="empty-state" id="empty-state">
        <p>Send a message, or attach an image / PDF / TXT file to get started.</p>
      </div>
    </main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span class="typing-indicator__dots">
        <span></span><span></span><span></span>
      </span>
      AI is typing...
    </div>

    <div id="attachment-preview" class="attachment-preview hidden">
      <span id="attachment-name" class="attachment-preview__name"></span>
      <button id="attachment-remove" class="attachment-preview__remove" type="button" aria-label="Remove attachment">✕</button>
    </div>

    <form id="chat-form" class="chat-input-bar">
      <input
        type="file"
        id="file-input"
        accept="image/png,image/jpeg,image/webp,application/pdf,text/plain"
        hidden
      />
      <button type="button" id="attach-btn" class="icon-btn" title="Attach file" aria-label="Attach file">
        📎
      </button>
      <textarea
        id="message-input"
        class="chat-input"
        placeholder="Type a message..."
        rows="1"
      ></textarea>
      <button type="submit" id="send-btn" class="send-btn">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
